<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community — Newscapes Live</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <header>
    <div class="container">
      <nav>
        <div class="nav-brand">
          <img class="brand-logo" src="" alt="">
          <span class="brand-name">Newscapes Live</span>
        </div>
        <div class="nav-links">
          <a href="../">Home</a>
          <a href="./">Community</a>
          <a href="../support/">Support</a>
        </div>
      </nav>
    </div>
  </header>

  <section class="hero" style="padding:2.5rem 1.25rem 1.5rem">
    <div class="container">
      <h1 style="color:var(--accent);margin-bottom:.5rem">Community</h1>
      <p style="color:var(--muted)">Message board, polls, and leaderboard — coming soon.</p>
    </div>
  </section>

  <section>
    <div class="container">
      <div class="section-title">Message Board</div>
      <div class="card"><p>Sign in to post and join the conversation.</p></div>
    </div>
  </section>

  <section>
    <div class="container">
      <div class="section-title">Active Polls</div>
      <div class="card" id="polls-container"><p>No active polls right now.</p></div>
    </div>
  </section>

  <section>
    <div class="container">
      <div class="section-title">Leaderboard</div>
      <div class="card" id="leaderboard"><p>Earn points by participating. Leaderboard loading...</p></div>
    </div>
  </section>

  <footer>
    <p>Newscapes Live &mdash; <a href="../">Home</a></p>
  </footer>

  <script type="module" src="../js/app.js"></script>
</body>
</html>
